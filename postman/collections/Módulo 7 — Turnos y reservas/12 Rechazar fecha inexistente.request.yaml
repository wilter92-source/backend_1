$kind: http-request
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "clientName": "Ana",
      "clientEmail": "ana@example.com",
      "date": "2026-02-30",
      "time": "10:30"
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 12000
