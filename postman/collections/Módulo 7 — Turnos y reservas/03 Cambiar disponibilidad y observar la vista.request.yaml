$kind: http-request
url: "{{baseUrl}}/api/services/{{sid}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "available": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('No disponible', () => pm.expect(pm.response.json().payload.available).to.be.false);
    language: text/javascript
order: 3000
